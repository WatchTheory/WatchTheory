<g mask="url(#bar)"><rect x="20.00" y="48" width="228.05" height="10" fill="#DA5B0B"/><rect x="250.05" y="48" width="56.29" height="10" fill="#3572A5"/><rect x="308.34" y="48" width="51.69" height="10" fill="#3D6117"/><rect x="362.03" y="48" width="7.54" height="10" fill="#b07219"/><rect x="371.57" y="48" width="6.42" height="10" fill="#e34c26"/><rect x="379.99" y="48" width="0.01" height="10" fill="#384d54"/></g>
<g transform="translate(20 84)"><g class="fade" style="animation-delay: 200ms"><circle cx="5" cy="6" r="5" fill="#DA5B0B"/><text x="16" y="11" class="label">Jupyter Noteb… <tspan class="secondary">65.2%</tspan></text></g></g>
<g transform="translate(200 84)"><g class="fade" style="animation-delay: 270ms"><circle cx="5" cy="6" r="5" fill="#3572A5"/><text x="16" y="11" class="label">Python <tspan class="secondary">16.1%</tspan></text></g></g>
<g transform="translate(20 116)"><g class="fade" style="animation-delay: 340ms"><circle cx="5" cy="6" r="5" fill="#3D6117"/><text x="16" y="11" class="label">TeX <tspan class="secondary">14.8%</tspan></text></g></g>
<g transform="translate(200 116)"><g class="fade" style="animation-delay: 410ms"><circle cx="5" cy="6" r="5" fill="#b07219"/><text x="16" y="11" class="label">Java <tspan class="secondary">2.2%</tspan></text></g></g>
<g transform="translate(20 148)"><g class="fade" style="animation-delay: 480ms"><circle cx="5" cy="6" r="5" fill="#e34c26"/><text x="16" y="11" class="label">HTML <tspan class="secondary">1.8%</tspan></text></g></g>
<g transform="translate(200 148)"><g class="fade" style="animation-delay: 550ms"><circle cx="5" cy="6" r="5" fill="#384d54"/><text x="16" y="11" class="label">Dockerfile <tspan class="secondary"><0.1%</tspan></text></g></g>
